<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バド・マッチメーカー v5.8 (Save対応版)</title>
<style>
    /* 全体のレイアウト調整：余白を極力減らす */
    body { font-family: sans-serif; padding: 10px; max-width: 600px; margin: 0 auto; background-color: #f0f4f8; }
    
    /* タイトルを小さく、控えめに */
    h1 { font-size: 16px; color: #333; margin: 0 0 10px 0; display: inline-block; }
    
    /* パネルの余白を詰める */
    .control-panel { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
    
    input[type="number"] { padding: 8px; font-size: 16px; width: 50px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    #removeNum, #courtCountGame, #courtCountSetup { width: 2.5em; padding: 8px 4px; }
    
    /* ボタン共通スタイル */
    button { font-size: 14px; border: none; border-radius: 5px; cursor: pointer; padding: 8px 12px; }
    
    /* メインのアクションボタン */
    .main-btn { background-color: #007bff; color: white; width: 100%; font-size: 18px; padding: 12px; font-weight: bold; margin-bottom: 5px; }
    .main-btn:hover { background-color: #0056b3; }
    .main-btn:active { transform: translateY(1px); }

    .reset-btn { background-color: #6c757d; color: white; font-size: 12px; padding: 5px 10px; float: right;}

    /* 履歴エリア（黒い部分） */
    #output { 
        background: #222; 
        color: #fff; 
        padding: 10px; 
        border-radius: 5px; 
        font-family: monospace; 
        min-height: 250px;
        height: calc(100vh - 250px);
        overflow-y: auto; 
        max-height: 600px; 
        font-size: 120%; 
        line-height: 1.4; 
    }
    .hidden { display: none; }
    
    /* 折りたたみエリア（details/summary） */
    details {
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #fafafa;
    }
    summary {
        padding: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #e9ecef;
        border-radius: 5px;
    }
    summary::after { content: "+"; font-size: 18px; font-weight: bold; }
    details[open] summary::after { content: "-"; }
    
    .details-content { padding: 10px; }

    /* 管理行のレイアウト */
    .manage-row { display: flex; align-items: center; margin-bottom: 8px; gap: 5px; flex-wrap: wrap; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
    .manage-row:last-child { border-bottom: none; margin-bottom: 0; }
    .manage-label { font-weight: bold; font-size: 12px; color: #555; }
    .manage-group { display: flex; align-items: center; gap: 2px; }
    .manage-group + .manage-group { border-left: 2px solid #999; padding-left: 10px; margin-left: 5px; }
    
    .remove-btn { background-color: #ffc107; color: #000; } 
    .add-btn { background-color: #28a745; color: white; }

    .player-list { font-size: 12px; color: #555; margin-top: 5px; background: #fff; padding: 5px; border: 1px solid #eee; }

    /* 除外リスト */
    #removedListArea {
        margin-top: 5px;
        padding: 5px;
        background-color: #fff3cd;
        border: 1px solid #ffeeba;
        border-radius: 4px;
        display: none; 
    }
    .removed-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
        font-size: 12px;
        border-bottom: 1px dotted #ccc;
        padding-bottom: 5px;
    }
    
    .restore-btn { background-color: #17a2b8; color: white; padding: 8px 12px; font-size: 14px; }
    .delete-btn { background-color: #dc3545; color: white; padding: 8px 12px; font-size: 14px; margin-left: 4px; }

    .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
    }

    /* ログ内のスタイル */
    .log-entry { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
    .log-header {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .log-header label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #fff; }
    .round-check { width: 20px; height: 20px; cursor: pointer; }

    .match-row {
        padding: 8px 10px;
        margin-bottom: 4px;
        border-radius: 4px;
        color: #000;
        font-weight: bold;
        font-size: 18px;
    }
    .log-footer { font-size: 14px; color: #ddd; margin-top: 5px; }

    /* --- 追加：ポップアップ通知のスタイル --- */
    #toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #dc3545; /* エラーっぽい赤色 */
        color: #fff;
        text-align: center;
        border-radius: 5px;
        padding: 12px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        top: 20px; /* 画面上部に表示 */
        transform: translateX(-50%);
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.3s, visibility 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #toast.show {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

<!-- 追加：ポップアップ通知用の要素 -->
<div id="toast">⚠️ チェックを入れてください</div>

<div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>🏸 マッチメーカー</h1>
    <button onclick="resetApp()" class="reset-btn">リセット</button>
</div>

<div id="setupArea" class="control-panel">
    <p style="margin:5px 0;">開始設定</p>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
        <label>人数 <input type="number" id="playerCount" value="6" min="4"></label>
        <label>コート <input type="number" id="courtCountSetup" value="2" min="1"></label>
    </div>
    <button onclick="startGame()" class="main-btn" style="font-size:16px;">スタート</button>
</div>

<div id="gameArea" class="control-panel hidden">
    <div class="status-bar">
        <span id="roundDisplay">第1回 (コート:2)</span>
        <span style="font-size:12px; font-weight:normal; color:#666;">待機等は自動計算</span>
    </div>

    <button onclick="generateMatch()" class="main-btn">次（組み合わせ作成）</button>

    <details id="settingsDetails">
        <summary>⚙️ 設定・メンバー管理</summary>
        <div class="details-content">
            <div class="manage-row">
                <span class="manage-label">コート</span>
                <input type="number" id="courtCountGame" value="2" min="1" onchange="updateCourtSetting()"> 面
                <span style="font-size:11px; color:#666;">(次回反映)</span>
            </div>

            <!-- 追加：音声読み上げ設定 -->
            <div class="manage-row">
                <label class="manage-label" style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                    <input type="checkbox" id="enableSpeech" onchange="saveState()"> 🗣️ 音声でペアを読み上げる
                </label>
            </div>

            <div class="manage-row">
                <div class="manage-group">
                    <span class="manage-label">追加</span>
                    <button onclick="addPlayerAuto()" class="add-btn">＋1名</button>
                </div>
                <div class="manage-group">
                    <span class="manage-label">休憩</span>
                    <input type="number" id="removeNum" placeholder="No.">
                    <button onclick="removePlayer()" class="remove-btn">除外</button>
                </div>
            </div>

            <div class="player-list">参加中: <span id="currentList" style="font-weight:bold;"></span></div>

            <div id="removedListArea">
                <p style="font-size:11px; margin:0; font-weight:bold; color:#856404;">休憩中リスト</p>
                <div id="removedListContent"></div>
            </div>
        </div>
    </details>
</div>

<div id="output">ここに履歴が表示されます...</div>

<script>
    let players = [];
    let removedPlayers = []; 
    let historyPairs = [];      // 累積のペア履歴（一巡用）
    let lastRoundPairs = [];    // 直前の回のペア履歴（連続防止用）
    let restHistory = [];
    let playerRestCounts = {}; 
    let matchCount = 0;
    let maxPlayerNumber = 0; 
    let currentCourtCount = 2; 

    const courtColors = ['#FFC0CB', '#FFFACD', '#E0FFFF', '#98FB98', '#E6E6FA', '#FFDAB9'];
    const STORAGE_KEY = 'badoMatchApp_saveData'; // 保存用のキー

    // ページ読み込み時にデータを復元
    window.onload = loadState;

    // --- データ保存機能 ---
    function saveState() {
        const state = {
            isGameStarted: document.getElementById('setupArea').style.display === 'none',
            players: players,
            removedPlayers: removedPlayers,
            historyPairs: historyPairs,
            lastRoundPairs: lastRoundPairs,
            restHistory: restHistory,
            playerRestCounts: playerRestCounts,
            matchCount: matchCount,
            maxPlayerNumber: maxPlayerNumber,
            currentCourtCount: currentCourtCount,
            courtCountGameValue: document.getElementById('courtCountGame').value,
            outputHtml: document.getElementById('output').innerHTML,
            enableSpeech: document.getElementById('enableSpeech').checked // 音声設定も保存
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // --- データ復元機能 ---
    function loadState() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            const state = JSON.parse(savedData);
            if (state.isGameStarted) {
                players = state.players;
                removedPlayers = state.removedPlayers;
                historyPairs = state.historyPairs;
                lastRoundPairs = state.lastRoundPairs;
                restHistory = state.restHistory;
                playerRestCounts = state.playerRestCounts;
                matchCount = state.matchCount;
                maxPlayerNumber = state.maxPlayerNumber;
                currentCourtCount = state.currentCourtCount;

                document.getElementById('setupArea').style.display = 'none';
                document.getElementById('gameArea').classList.remove('hidden');
                document.getElementById('gameArea').style.display = 'block';

                document.getElementById('courtCountGame').value = state.courtCountGameValue || currentCourtCount;
                document.getElementById('output').innerHTML = state.outputHtml;
                
                // 音声設定の復元
                if (state.enableSpeech !== undefined) {
                    document.getElementById('enableSpeech').checked = state.enableSpeech;
                }

                updateStatusDisplay();
                updatePlayerListDisplay();
            }
        }
    }

    // チェックボックスの状態変更を検知してHTMLの属性に反映し、保存する
    document.getElementById('output').addEventListener('change', function(e) {
        if (e.target.classList.contains('round-check')) {
            if (e.target.checked) {
                e.target.setAttribute('checked', 'checked');
            } else {
                e.target.removeAttribute('checked');
            }
            saveState(); // チェック状態も保存
        }
    });

    // --- 追加：ポップアップ表示関数 ---
    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        // 1秒(1000ミリ秒)後にクラスを削除して隠す
        setTimeout(function(){ 
            toast.className = toast.className.replace("show", ""); 
        }, 1000);
    }

    function startGame() {
        const pCountInput = document.getElementById('playerCount').value;
        const cCountInput = document.getElementById('courtCountSetup').value;
        const count = parseInt(pCountInput);
        const courts = parseInt(cCountInput);
        
        if (isNaN(count) || count < 4) { alert("人数は4人以上で"); return; }
        if (isNaN(courts) || courts < 1) { alert("コート数は1面以上で"); return; }
        
        maxPlayerNumber = count; 
        currentCourtCount = courts;
        document.getElementById('courtCountGame').value = currentCourtCount;

        players = [];
        removedPlayers = [];
        playerRestCounts = {}; 
        for(let i=1; i<=count; i++) {
            players.push(i);
            playerRestCounts[i] = 0;
        }

        historyPairs = [];
        lastRoundPairs = [];
        restHistory = [];
        matchCount = 0;

        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('gameArea').classList.remove('hidden');
        document.getElementById('gameArea').style.display = 'block';
        
        document.getElementById('output').innerHTML = `<div class="log-header">--- 開始: ${count}名 / コート${currentCourtCount}面 ---</div>`;
        updateStatusDisplay();
        updatePlayerListDisplay();
        saveState(); // 保存
    }

    function updateCourtSetting() {
        const val = parseInt(document.getElementById('courtCountGame').value);
        if(!isNaN(val) && val > 0) {
            currentCourtCount = val;
            updateStatusDisplay();
            saveState(); // 保存
        }
    }

    function updateStatusDisplay() {
        document.getElementById('roundDisplay').textContent = `第${matchCount}回 (コート:${currentCourtCount})`;
    }

    function prependHtml(htmlString) {
        const outputDiv = document.getElementById('output');
        outputDiv.insertAdjacentHTML('afterbegin', htmlString);
        outputDiv.scrollTop = 0; 
    }

    function prependLog(text) {
        const html = `<div class="log-entry" style="border:none; margin-bottom:5px; font-size:14px; color:#aaa;">${text.replace(/\n/g, '<br>')}</div>`;
        prependHtml(html);
    }

    function addPlayerAuto() {
        maxPlayerNumber++; 
        const newPlayerNum = maxPlayerNumber;
        const minRest = players.length > 0 ? Math.min(...players.map(p => playerRestCounts[p] || 0)) : 0;
        playerRestCounts[newPlayerNum] = minRest;
        players.push(newPlayerNum);
        updatePlayerListDisplay();
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        prependLog(`[${timeStr}] 参加：${newPlayerNum}番`);
        saveState(); // 保存
    }

    function removePlayer() {
        const numInput = document.getElementById('removeNum');
        const numToRemove = parseInt(numInput.value);
        if (isNaN(numToRemove)) return;
        if (!players.includes(numToRemove)) { alert("その番号は参加中にいません"); return; }
        if (players.length <= 4) { alert("4人を下回るため除外できません"); return; }

        players = players.filter(p => p !== numToRemove);
        removedPlayers.push(numToRemove);
        removedPlayers.sort((a,b) => a-b);
        updatePlayerListDisplay();
        
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        prependLog(`[${timeStr}] 休憩へ：${numToRemove}番`);
        numInput.value = '';
        saveState(); // 保存
    }

    function restorePlayer(num) {
        if (!removedPlayers.includes(num)) return;
        removedPlayers = removedPlayers.filter(p => p !== num);
        players.push(num);
        players.sort((a,b) => a-b);
        const minRest = players.length > 0 ? Math.min(...players.map(p => playerRestCounts[p] || 0)) : 0;
        playerRestCounts[num] = minRest;
        updatePlayerListDisplay();
        prependLog(`[通知] ${num}番が復帰しました`);
        saveState(); // 保存
    }

    function deletePlayerPermanent(num) {
        if (!confirm(`${num}番を完全に削除しますか？`)) return;
        removedPlayers = removedPlayers.filter(p => p !== num);
        updatePlayerListDisplay();
        prependLog(`[通知] ${num}番を完全削除`);
        saveState(); // 保存
    }

    function updatePlayerListDisplay() {
        const listSpan = document.getElementById('currentList');
        if(listSpan) listSpan.textContent = players.join(', ');

        const removedArea = document.getElementById('removedListArea');
        const removedContent = document.getElementById('removedListContent');
        if (removedPlayers.length > 0) {
            removedArea.style.display = 'block';
            removedContent.innerHTML = '';
            removedPlayers.forEach(num => {
                const div = document.createElement('div');
                div.className = 'removed-item';
                div.innerHTML = `<span><b>${num}番</b></span><button onclick="restorePlayer(${num})" class="restore-btn">復帰</button><button onclick="deletePlayerPermanent(${num})" class="delete-btn">削除</button>`;
                removedContent.appendChild(div);
            });
        } else {
            removedArea.style.display = 'none';
        }
    }

    function resetApp() { 
        if(confirm("最初に戻りますか？(現在の履歴はすべて消去されます)")) {
            localStorage.removeItem(STORAGE_KEY); // 保存データも消去する
            location.reload(); 
        }
    }

    // --- 追加：試合の音読用関数 ---
    function speakMatches(matches, waitingList) {
        // チェックボックスが入っていなければ終了、ブラウザが対応していなければ終了
        if (!document.getElementById('enableSpeech').checked) return;
        if (!('speechSynthesis' in window)) return;

        // 読み上げ中の音声があればキャンセル
        speechSynthesis.cancel();

        let textToSpeak = `第${matchCount}回を始めます。`;
        
        matches.forEach((m, index) => {
            const courtLabel = String.fromCharCode(65 + index); // A, B, C...
            textToSpeak += `${courtLabel}コート。${m.team1[0]}番、${m.team1[1]}番。対。${m.team2[0]}番、${m.team2[1]}番。`;
        });

        if (waitingList.length > 0) {
            textToSpeak += `待機は、${waitingList.join('番、')}番です。`;
        }

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9; // 少しゆっくり読む
        speechSynthesis.speak(utterance);
    }

    function generateMatch() {
        // --- 追加：直前のチェックボックスがチェックされているか確認 ---
        const checks = document.querySelectorAll('.round-check');
        if (checks.length > 0) {
            const latestCheck = checks[0]; // 上に追加されるので[0]が最新
            if (!latestCheck.checked) {
                showToast(); // 1秒ポップアップ表示
                return;      // 処理を中断して生成させない
            }
        }
        // --------------------------------------------------------

        updateCourtSetting();
        matchCount++;
        updateStatusDisplay();

        let currentPlayers = [...players];
        let numMatches = Math.min(currentCourtCount, Math.floor(currentPlayers.length / 4));
        let numActive = numMatches * 4;
        let numWaiting = currentPlayers.length - numActive;
        
        let candidates = shuffle([...currentPlayers]);
        let lastRested = restHistory.length > 0 ? restHistory[restHistory.length - 1] : [];

        // 待機回数と直前待機を考慮してソート
        candidates.sort((a, b) => {
            let countA = playerRestCounts[a] || 0;
            let countB = playerRestCounts[b] || 0;
            let penaltyA = lastRested.includes(a) ? 1000 : 0;
            let penaltyB = lastRested.includes(b) ? 1000 : 0;
            return (countA + penaltyA) - (countB + penaltyB);
        });

        let waiting = candidates.slice(0, numWaiting);
        waiting.forEach(p => playerRestCounts[p] = (playerRestCounts[p] || 0) + 1);
        restHistory.push(waiting);
        
        let activePlayers = currentPlayers.filter(p => !waiting.includes(p));

        // ペア生成ロジック
        let bestPairs = [];
        let success = false;
        let attempts = 0;
        const maxPairsPossible = (players.length * (players.length - 1)) / 2;

        // 全ペア一巡チェック：リセットが必要か事前に判断
        if (historyPairs.length >= maxPairsPossible - numMatches * 2) {
            historyPairs = []; // ほぼ使い切ったのでリセット
        }

        while(attempts < 500 && !success) {
            let tempActive = shuffle([...activePlayers]);
            let tempPairs = [];
            let possible = true;
            for (let i = 0; i < tempActive.length; i += 2) {
                let p1 = tempActive[i];
                let p2 = tempActive[i+1];
                let pairId = [p1, p2].sort().join('-');
                
                // 【重要】直前の回と同じペアは絶対にNG、かつ累積履歴にもないものを選ぶ
                if (lastRoundPairs.includes(pairId) || historyPairs.includes(pairId)) {
                    possible = false;
                    break;
                }
                tempPairs.push([p1, p2]);
            }
            if (possible) {
                bestPairs = tempPairs;
                success = true;
            }
            attempts++;
        }

        // 万が一、未対戦ペアが見つからない場合は累積履歴を無視して「直前との重複」のみ回避
        if (!success) {
            attempts = 0;
            while(attempts < 500 && !success) {
                let tempActive = shuffle([...activePlayers]);
                let tempPairs = [];
                let possible = true;
                for (let i = 0; i < tempActive.length; i += 2) {
                    let p1 = tempActive[i];
                    let p2 = tempActive[i+1];
                    let pairId = [p1, p2].sort().join('-');
                    if (lastRoundPairs.includes(pairId)) { // 直前重複のみチェック
                        possible = false;
                        break;
                    }
                    tempPairs.push([p1, p2]);
                }
                if (possible) {
                    bestPairs = tempPairs;
                    success = true;
                }
                attempts++;
            }
        }
        
        // 履歴の更新
        const currentRoundPairIds = bestPairs.map(p => p.sort().join('-'));
        lastRoundPairs = [...currentRoundPairIds]; // 直前履歴を更新
        currentRoundPairIds.forEach(id => {
            if (!historyPairs.includes(id)) historyPairs.push(id);
        });

        // 試合表示
        let matches = [];
        for (let i = 0; i < bestPairs.length; i += 2) {
            if (i + 1 < bestPairs.length) {
                matches.push({ team1: bestPairs[i], team2: bestPairs[i+1] });
            }
        }

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        let entryHtml = `<div class="log-entry"><div class="log-header"><span>--- [${timeStr}] (${matchCount}回) ---</span><label><input type="checkbox" class="round-check"> <span style="font-size:12px;">完了</span></label></div>`;
        
        matches.forEach((m, index) => {
            const courtLabel = String.fromCharCode(65 + index);
            const color = courtColors[index % courtColors.length];
            entryHtml += `<div class="match-row" style="background-color: ${color};">${courtLabel}：${m.team1[0]}・${m.team1[1]} VS ${m.team2[0]}・${m.team2[1]}</div>`;
        });
        
        entryHtml += `<div class="log-footer">（待機：${waiting.length > 0 ? waiting.join('・') : 'なし'}）</div></div>`;
        prependHtml(entryHtml);

        // --- 追加：音声読み上げ処理の呼び出し ---
        speakMatches(matches, waiting);

        saveState(); // 保存
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
